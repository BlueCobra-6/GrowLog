<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14262b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GrowLog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>GrowLog</title>
<style>
:root{
  --bg:#14262b;--card:#1d363c;--card2:#244249;--line:#2f525a;--text:#eef4ef;--mute:#9db5b5;
  --accent:#4ade80;--gold:#f5c451;--orange:#f08a4b;--blue:#6cb6ff;--red:#f06a6a;--ink:#0b1a1d;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(72px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-weight:650}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 14px 8px;border-bottom:1px solid var(--line)}
.top .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.top h1{font-size:20px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.gsel{width:auto;max-width:60%;font-weight:650;font-size:18px;background:transparent;border:0;padding:4px 0}
.sub{color:var(--mute);font-size:13px}
main{padding:12px 14px}
.chips{display:flex;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.section{margin:0 0 20px}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sechead h3{font-size:18px}
.sechead .gear{margin-left:auto;color:var(--mute);padding:4px 8px;font-size:18px}
.conts{display:flex;gap:10px;flex-wrap:wrap}
.cont{background:#081a1e;border-radius:14px;padding:8px;border:1px solid var(--line)}
.cont .cn{font-size:12px;color:var(--mute);margin:0 4px 6px}
.grid{display:grid;gap:6px;grid-template-columns:repeat(var(--cols),var(--sz,64px))}
.cont{max-width:100%;overflow-x:auto}
.grid.sm .slot .em{font-size:18px}.grid.sm .slot .lbl,.grid.sm .slot .dd{font-size:8px;max-width:44px}
.grid.sm .slot .lbl.v{display:none}
.grid.xs .slot .em{font-size:16px}.grid.xs .slot .lbl,.grid.xs .slot .dd{display:none}
.chip.water+.gear{margin-left:0}
.chip.water{margin-left:auto;padding:4px 10px;font-size:13px}
.chip.water.soon{border-color:var(--gold);color:var(--gold)}
.chip.water.late{border-color:var(--orange);color:var(--orange);background:#432c20}
.grid.xs .slot.gz::after{width:13px;height:13px;font-size:8px;line-height:10px;top:-3px;right:-3px}
.slot{width:var(--sz,64px);height:var(--sz,64px);border-radius:50%;background:var(--card);color:var(--mute);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border:2px solid transparent;position:relative}
.slot.empty:active{background:var(--card2)}
.slot .em{font-size:22px}
.slot .lbl{font-size:9px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.slot .lbl.v{font-size:8px;color:var(--mute);margin-top:-1px}
.slot .dd{font-size:9px;color:var(--mute)}
.slot.gz::after{content:'🌱';position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1.5px solid var(--rc);font-size:10px;line-height:15px;text-align:center}
.slot.ring::before{content:'';position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--tc) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));pointer-events:none}
.slot.ready{background:#3a3a22}
.slot.over{background:#432c20}
.slot.target{outline:2px dashed var(--accent);outline-offset:2px}
.slot.moving{opacity:.45}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.row2{display:flex;align-items:center;gap:10px}
.grow1{flex:1;min-width:0}
.big{font-size:28px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0f1f23;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 0;position:relative}
.tabbar button .ic{font-size:20px}
.tabbar button.on{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--gold);color:var(--ink);border-radius:99px;font-size:10px;font-weight:700;padding:0 5px;min-width:16px}
.banner{position:sticky;top:calc(54px + var(--safe-t));z-index:15;background:var(--accent);color:var(--ink);padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:550}
.banner button{margin-left:auto;background:var(--ink);color:var(--text);border-radius:8px;padding:4px 10px}
.btn{background:var(--accent);color:var(--ink);font-weight:650;border-radius:12px;padding:12px 16px;width:100%;text-align:center}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.danger{background:#5a2b2b;color:#ffd5d5}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.btns.three{grid-template-columns:repeat(3,1fr)}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#1a3238;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--safe-b));border-top:1px solid var(--line)}
.sh h2{font-size:20px;margin-bottom:4px}
.sh label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.sh .x{position:absolute;right:12px;top:10px;color:var(--mute);font-size:22px;padding:4px 8px}
.pick{max-height:38vh;overflow:auto;margin:8px 0;border-radius:12px}
.crow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent}
.crow.sel{background:var(--card2);border-color:var(--accent)}
.crow .em{font-size:24px;width:32px;text-align:center}
.bar{height:10px;background:var(--card);border-radius:99px;overflow:hidden;position:relative;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:var(--blue)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;background:var(--card2)}
.pill.germ{background:#1d3d5a;color:var(--blue)}.pill.grow{background:#1d4a31;color:var(--accent)}
.pill.ready{background:#514a1c;color:var(--gold)}.pill.over{background:#59301b;color:var(--orange)}
.fav{font-size:20px;padding:2px 6px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emo button{font-size:22px;padding:4px 6px;border-radius:8px;background:var(--card)}
.emo button.on{background:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.logline{font-size:13px;color:var(--mute);padding:3px 0;border-bottom:1px dashed var(--line)}
.empty-note{color:var(--mute);text-align:center;padding:30px 10px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);background:#eef4ef;color:var(--ink);padding:8px 14px;border-radius:10px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.mv{background:var(--card2);color:var(--text);border-radius:10px;width:44px;height:36px;font-size:16px}
.mv.sm{width:36px;height:28px;font-size:13px}
.mv:disabled{opacity:.3}
.mv:not(:disabled):active{background:var(--accent);color:var(--ink)}
.reordering .slot{pointer-events:none;opacity:.55}
.warn{background:#4a3a1c;border:1px solid var(--gold);color:#ffe9b0;border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ helpers ============ */
const KEY='growlog.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>fmt(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=(a,b=today())=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const nice=s=>parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const niceY=s=>parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const ozFmt=oz=>oz>=16?(+(oz/16).toFixed(2))+' lb':(+(+oz).toFixed(1))+' oz';
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ model ============ */
const LAYOUTS={
  pods12:{label:'12 pods',n:12,cols:3},
  pods8:{label:'8 pods',n:8,cols:2},
  holes4:{label:'4 holes',n:4,cols:2},
  holes2:{label:'2 holes',n:2,cols:1},
  nur4:{label:'Nursery · 4 slots',n:4,cols:4},
  nur6:{label:'Nursery · 6 slots',n:6,cols:3}
};
const GRID=/^g:(\d+)x(\d+)$/;
const clampN=(v,a=1,b=20)=>Math.max(a,Math.min(b,Math.round(+v)||a));
const gridId=(r,c)=>`g:${clampN(r)}x${clampN(c)}`;
const isGrid=l=>GRID.test(l||'');
function dims(c){const m=GRID.exec(c.layout||'');if(m){const r=+m[1],k=+m[2];return{label:`${r}×${k} grid`,n:r*k,cols:k,rows:r,custom:true}}return LAYOUTS[c.layout]||LAYOUTS.pods8}
function slotSize(cols){const avail=Math.min(window.innerWidth,520)-80;return Math.max(34,Math.min(64,Math.floor((avail-6*(cols-1))/cols)))}
const mkContainer=(name,layout)=>({id:uid(),name,layout});
const mkSection=(name,kind,layout,cname='')=>({id:uid(),name,kind,containers:[mkContainer(cname,layout)]});
function mkGarden(name,template){
  const g={id:uid(),name,sections:[]};
  if(template==='trio'){
    ['Alpha','Bravo','Charlie'].forEach(n=>g.sections.push(mkSection(n,'nursery','nur4')));
    ['Top level','Middle level','Bottom level'].forEach(n=>{
      const s=mkSection(n,'tray','pods8','Tray 1');s.containers.push(mkContainer('Tray 2','holes4'));g.sections.push(s);
    });
  }
  return g;
}
const SEED_CROPS=[
  {name:'Radish',variety:'Magnet',emoji:'🌱',germ:10,harvest:60,yield:2.1,cut:false,window:30,note:'Numbers from Rise app'},
  {name:'Bean',variety:'Mascotte',emoji:'🫘',germ:8,harvest:55,yield:7.1,cut:true,window:60,note:'Numbers from Rise app'},
  {name:'Basil',variety:'Genovese',emoji:'🌿',germ:5,harvest:35,yield:3,cut:true,window:90,note:'Estimate - edit me'},
  {name:'Lettuce',variety:'Butter Crunch',emoji:'🥬',germ:4,harvest:40,yield:4,cut:false,window:21,note:'Estimate - edit me'},
  {name:'Chives',variety:'Staro',emoji:'🌿',germ:10,harvest:60,yield:2,cut:true,window:90,note:'Estimate - edit me'},
  {name:'Pepper',variety:'Red chili',emoji:'🌶️',germ:10,harvest:90,yield:6,cut:true,window:90,note:'Estimate - edit me'}
].map(c=>({id:uid(),fav:false,...c}));
function seed(){
  const g=mkGarden('Trio','trio');
  return {v:1,gardens:[g],active:g.id,crops:SEED_CROPS,plantings:[],harvests:[],meta:{lastBackup:null,created:today()}};
}
let db=(()=>{try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.gardens&&d.crops)return d}}catch(e){}return seed()})();
let saveFailed=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));saveFailed=false}catch(e){saveFailed=true;toast('⚠️ Could not save - export a backup!')}
}
save();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ============ queries ============ */
const curGarden=()=>db.gardens.find(g=>g.id===db.active)||db.gardens[0];
const crop=id=>db.crops.find(c=>c.id===id)||{id,name:'(deleted crop)',variety:'',emoji:'❔',germ:0,harvest:999,yield:0,window:30};
const plantAt=(cid,i)=>db.plantings.find(p=>p.status==='active'&&p.loc.c===cid&&p.loc.i===i);
const activeP=()=>db.plantings.filter(p=>p.status==='active');
const cname=c=>`${esc(crop(c).name)}${crop(c).variety?' · '+esc(crop(c).variety):''}`;
function locOf(cid){for(const g of db.gardens)for(const s of g.sections)for(const c of s.containers)if(c.id===cid)return{g,s,c};return null}
function locLabel(p){const L=locOf(p.loc.c);return L?[L.g.name,L.s.name,L.c.name,'#'+(p.loc.i+1)].filter(Boolean).join(' › '):'(location removed)'}
function stageOf(p){
  const c=crop(p.cropId),d=days(p.plantedAt),w=c.window??30;
  if(d<c.germ)return'germ';if(d<c.harvest)return'grow';if(d<=c.harvest+w)return'ready';return'over';
}
const xpDay=c=>c.xplant>0?c.xplant:Math.max(c.germ+3,Math.min(c.germ+10,Math.round(c.harvest*.6)));
function inNursery(p){const L=locOf(p.loc.c);return !!L&&L.s.kind==='nursery'}
/* phase: germ (nursery, not germinated) | nurs (nursery, germinated) | tray */
function phaseOf(p){
  if(!inNursery(p))return'tray';
  return p.germinatedAt?'nurs':'germ';
}
const RING={germ:'#6ab0ff',nurs:'#4fd1c5',tray:'#4ade80',ready:'#f5c542',over:'#ff8a4c',check:'#ffb347'};
function ringOf(p){
  const c=crop(p.cropId),d=days(p.plantedAt),ph=phaseOf(p);
  const clamp=x=>Math.max(0,Math.min(1,x));
  if(ph==='germ'){const f=d/Math.max(1,c.germ);return{pct:clamp(f)*100,color:f>=1?RING.check:RING.germ,ph,tip:f>=1?'Germination due - check it':`Germination in ~${Math.max(0,c.germ-d)}d`}}
  if(ph==='nurs'){
    const dg=Math.max(0,Math.min(days(p.plantedAt,p.germinatedAt),xpDay(c)-1)),xp=xpDay(c),f=(d-dg)/Math.max(1,xp-dg);
    return{pct:clamp(f)*100,color:f>=1?RING.ready:RING.nurs,ph,tip:f>=1?'Ready to transplant':`Transplant in ~${xp-d}d`}}
  const st=stageOf(p);
  if(st==='ready')return{pct:100,color:RING.ready,ph,tip:'Ready to harvest'};
  if(st==='over')return{pct:100,color:RING.over,ph,tip:'Past harvest window'};
  const t0=p.trayAt?days(p.plantedAt,p.trayAt):Math.min(days(p.plantedAt,p.germinatedAt||p.plantedAt),Math.round(c.harvest*.3));
  const f=(d-t0)/Math.max(1,c.harvest-t0);
  return{pct:clamp(f)*100,color:RING.tray,ph,tip:`Harvest in ~${Math.max(0,c.harvest-d)}d`};
}
const STAGE_LABEL={germ:'Germinating',grow:'Growing',ready:'Ready to harvest',over:'Past harvest window'};
const logP=(p,t,n='')=>{p.log.push({d:today(),t,n})};
const emptySlots=cid=>{const L=locOf(cid);if(!L)return[];const out=[];for(let i=0;i<dims(L.c).n;i++)if(!plantAt(cid,i))out.push(i);return out};
function dueItems(){
  const out={ready:[],over:[],germ:[],xp:[],soon:[]};
  for(const p of activeP()){
    const c=crop(p.cropId),d=days(p.plantedAt),st=stageOf(p);
    if(st==='over')out.over.push(p);else if(st==='ready')out.ready.push(p);
    else if(inNursery(p)&&!p.germinatedAt&&d>=c.germ&&d>0)out.germ.push(p);
    else if(inNursery(p)&&p.germinatedAt&&d>=xpDay(c))out.xp.push(p);
    if(st!=='over'&&st!=='ready'&&c.harvest-d<=7&&c.harvest-d>0)out.soon.push(p);
  }
  return out;
}

function secContIds(sec){return sec.containers.map(c=>c.id)}
function secPlants(sec){const ids=secContIds(sec);return activeP().filter(p=>ids.includes(p.loc.c))}
function waterInfo(sec){
  if(sec.kind!=='nursery')return null;
  const pl=secPlants(sec);if(!pl.length)return null;
  const auto=!sec.waterAt,base=sec.waterAt||pl.map(p=>p.plantedAt).sort()[0],every=sec.waterEvery>0?sec.waterEvery:7;
  return{base,auto,every,left:every-days(base),due:addDays(base,every)};
}
const waterLbl=l=>l>1?`in ${l}d`:l===1?'tomorrow':l===0?'today':`${-l}d late`;
function waterDue(){
  const out=[];
  for(const g of db.gardens)for(const sec of g.sections){const w=waterInfo(sec);if(w&&w.left<=1)out.push({g,sec,w})}
  return out.sort((a,b)=>a.w.left-b.w.left);
}
/* a nursery that just went from empty to in-use starts with fresh water */
function noteFill(cid,date){
  const L=locOf(cid);if(!L||L.s.kind!=='nursery')return;
  if(!secPlants(L.s).length)L.s.waterAt=date||today();
}
const STARTER_CSV=`name,variety,germ_days,harvest_days,yield_oz,cut,window_days,emoji,note
Kale,Scarlet,7,50,6.3,yes,60,🥬,Rise product page
Kale,Starbor,5,42,6.3,yes,60,🥬,Rise product page
Kale,Mini,10,53,6.3,yes,60,🥬,Rise product page
Collards,Top Bunch,5,42,7.1,yes,60,🥬,Rise product page
Cabbage,China King,5,50,8.8,yes,60,🥬,Rise product page
Cabbage,Caraflex,5,50,8.8,yes,60,🥬,Rise product page
Cabbage,Red Omero,5,50,7.1,yes,60,🥬,Rise product page
Chard,Bright Lights,7,39,3.5,yes,60,🥬,Rise product page
Chinese Broccoli,Early Jade,7,50,3.5,yes,60,🥬,Rise product page
Broccoli Raab,Sweet,7,50,7.1,yes,60,🥬,Rise product page
Tatsoi,Classic,12,50,3.5,yes,60,🥬,Rise product page
Tatsoi,Red Cloud,12,50,3.5,yes,60,🥬,Rise product page
Pak Choi,Toy Choy,12,45,3.5,yes,60,🥬,Rise product page
Pak Choi,Red,12,45,3.5,yes,60,🥬,Rise product page
Endive,Benefine,5,45,3.5,yes,60,🥬,Rise product page
Sorrel,Red Veined,10,50,1.8,yes,60,🥬,Rise product page
Arugula,Mild,7,27,3.5,yes,60,🥬,Rise product page
Arugula,Astro,5,15,3.5,yes,60,🥬,Rise product page
Rocket,,7,27,3.5,yes,60,🥬,Rise Wild Rocket page had no numbers - using Mild Arugula
Lettuce,Red Oakleaf,7,27,3.5,yes,45,🥬,Rise product page
Lettuce,Alfresco Mix,5,25,3.5,yes,45,🥬,Rise product page
Lettuce,Red Romaine,5,25,3.5,yes,45,🥬,Rise product page

/* ============ crop import ============ */
const ckey=(n,v)=>(String(n||'')+'|'+String(v||'')).toLowerCase().replace(/[^a-z0-9|]/g,'');
function parseDelimited(text,delim){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(c=>c.trim()));
}
const HDR={name:'name',crop:'name',plant:'name',variety:'variety',cultivar:'variety',germ:'germ',germ_days:'germ',germinate:'germ',germination:'germ',
  harvest:'harvest',harvest_days:'harvest',days_to_harvest:'harvest',yield:'yield',yield_oz:'yield',cut:'cut',regrow:'cut',cut_and_regrow:'cut',
  window:'window',window_days:'window',emoji:'emoji',icon:'emoji',note:'note',notes:'note'};
const DEFAULT_COLS=['name','variety','germ','harvest','yield','cut','window','emoji','note'];
function guessEmoji(n){n=(n||'').toLowerCase();
  const m=[[/lettuce|romaine|kale|spinach|celery|rocket|arugula|chard|pac/,'🥬'],[/basil|parsley|dill|thyme|cilantro|coriander|chive|sage|oregano|catnip/,'🌿'],[/mint/,'🍃'],[/chili|chile|jalape/,'🌶️'],[/pepper/,'🫑'],[/bean|pea/,'🫘'],[/cucumber/,'🥒'],[/onion|garlic|leek/,'🧅'],[/tomato/,'🍅'],[/strawberr/,'🍓'],[/carrot/,'🥕'],[/flower|marigold|zinnia|borage|nasturtium/,'🌸']];
  for(const [re,e] of m)if(re.test(n))return e;return'🌱'}
function parseCrops(text){
  text=(text||'').trim();
  if(!text)return{rows:[],bad:0};
  let recs=[];
  if(text[0]==='['||text[0]==='{'){
    try{let j=JSON.parse(text);if(!Array.isArray(j))j=j.crops||[j];recs=j.map(o=>{const r={};for(const k in o){const m=HDR[k.toLowerCase()];if(m)r[m]=o[k]}return r})}
    catch(e){return{rows:[],bad:0,error:'Could not read that as JSON'}}
  }else{
    const first=text.split(/\r?\n/)[0];
    const delim=first.includes('\t')?'\t':(first.includes(';')&&!first.includes(',')?';':',');
    const grid=parseDelimited(text,delim);
    let cols=DEFAULT_COLS,start=0;
    const h=grid[0].map(c=>c.trim().toLowerCase().replace(/[\s-]+/g,'_'));
    if(h.some(c=>HDR[c]==='name')&&h.some(c=>['germ','harvest','yield','variety'].includes(HDR[c]))){cols=h.map(c=>HDR[c]||null);start=1}
    recs=grid.slice(start).map(r=>{const o={};r.forEach((v,i)=>{if(cols[i])o[cols[i]]=v.trim()});return o});
  }
  const rows=[];let bad=0;const seen=new Set();
  for(const r of recs){
    const name=String(r.name||'').trim();const harvest=num(r.harvest,0);
    if(!name||harvest<=0){bad++;continue}
    const cut=/^(y|yes|true|1|x)$/i.test(String(r.cut??'').trim());
    const c={name,variety:String(r.variety||'').trim(),emoji:String(r.emoji||'').trim()||guessEmoji(name),
      germ:Math.max(0,Math.round(num(r.germ,7))),harvest:Math.round(harvest),yield:num(r.yield,3),cut,
      window:r.window!==undefined&&String(r.window).trim()!==''?Math.round(num(r.window,30)):(cut?90:30),note:String(r.note||'').trim()};
    const k=ckey(c.name,c.variety);if(seen.has(k))continue;seen.add(k);
    c.exists=db.crops.find(x=>ckey(x.name,x.variety)===k)||null;
    rows.push(c);
  }
  return{rows,bad};
}
function impPreview(){
  const P=parseCrops(S.text);
  if(P.error)return`<div class="warn">${P.error}</div>`;
  if(!P.rows.length)return`<div class="empty-note">Paste crops or load the starter set.</div>`;
  const nNew=P.rows.filter(r=>!r.exists).length,nEx=P.rows.length-nNew;
  return `<div class="sub" style="margin:6px 0"><b>${nNew}</b> new · <b>${nEx}</b> already in your library${nEx?(S.update?' (will be updated)':' (will be skipped)'):''}${P.bad?` · ${P.bad} skipped (missing name or harvest days)`:''}</div>
  <div class="pick">${P.rows.map(r=>`<div class="crow"><span class="em">${r.emoji}</span><span class="grow1"><b>${esc(r.name)}</b>${r.variety?' · '+esc(r.variety):''}<br><span class="sub">${r.germ}d germinate · ${r.harvest}d harvest · ${r.yield} oz${r.note?' · '+esc(r.note):''}</span></span><span class="pill ${r.exists?'':'grow'}">${r.exists?'exists':'new'}</span></div>`).join('')}</div>`;
}

function render(){

  $('#app').innerHTML=header()+banner()+`<main class="${ui.reorder&&ui.tab==='garden'?'reordering':''}">${view()}</main>`+
    `<nav class="tabbar">${TABS.map(([k,ic,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-k="${k}"><span class="ic">${ic}</span>${l}${k==='due'&&dueN?`<span class="badge">${dueN}</span>`:''}</button>`).join('')}</nav>`;
  window.scrollTo(0,y);
}
function header(){
  const titles={due:'Needs attention',crops:'Crop library',log:'History',more:'More'};
  if(ui.tab==='garden'){
    const a=activeP().filter(p=>locOf(p.loc.c)&&locOf(p.loc.c).g.id===curGarden().id);
    const ready=a.filter(p=>['ready','over'].includes(stageOf(p))).length;
    return `<div class="top"><div class="row"><select class="gsel" data-bind="garden">${db.gardens.map(g=>`<option value="${g.id}" ${g.id===curGarden().id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><span class="sub">${a.length} planted${ready?` · ${ready} ready`:''}</span></div></div>`;
  }
  return `<div class="top"><div class="row"><h1>${titles[ui.tab]}</h1></div></div>`;
}
function banner(){
  if(ui.reorder&&ui.tab==='garden')return `<div class="banner">Reorder mode - use the arrows<button data-act="reorderToggle">Done</button></div>`;
  if(!ui.moving)return'';

}
function view(){return({garden:gardenView,due:dueView,crops:cropsView,log:logView,more:moreView})[ui.tab]()}

function slotLbl(c){
  const L=/^lettuce$/i.test(c.name);
  if(L&&c.variety)return `<span class="lbl">${esc(c.variety)}</span>`;
  if(c.variety)return `<span class="lbl">${esc(c.name)}</span><span class="lbl v">${esc(c.variety)}</span>`;
  return `<span class="lbl">${esc(c.name)}</span>`}
function slotHtml(cid,i){
  const p=plantAt(cid,i);
  const mv=ui.moving&&db.plantings.find(x=>x.id===ui.moving);
  if(!p)return `<button class="slot empty ${mv?'target':''}" data-act="slot" data-c="${cid}" data-i="${i}" aria-label="Empty slot ${i+1}">＋</button>`;
  const c=crop(p.cropId),st=stageOf(p),d=days(p.plantedAt);
  const R=ringOf(p);
  return `<button class="slot ring ${R.ph==='nurs'?'gz':''} ${st} ${mv&&mv.id===p.id?'moving':''} ${mv&&mv.id!==p.id?'target':''}" style="--p:${R.pct.toFixed(1)};--rc:${R.color};--tc:${R.color}4d" title="${R.tip}" data-act="slot" data-c="${cid}" data-i="${i}"><span class="em">${c.emoji}</span>${slotLbl(c)}<span class="dd">D${d}</span></button>`;
}
function gardenView(){
  const g=curGarden();
  let h=`<div class="chips">${[['all','All'],['nursery','Nurseries'],['tray','Trays']].map(([k,l])=>`<button class="chip ${ui.kind===k?'on':''}" data-act="kind" data-k="${k}">${l}</button>`).join('')}<button class="chip ${ui.reorder?'on':''}" data-act="reorderToggle" style="margin-left:auto">↕ Reorder</button></div>`;

  if(!secs.length)h+=`<div class="empty-note">Nothing here yet. Add a shelf or nursery below.</div>`;
  for(const s of secs){
    const tot=s.containers.reduce((a,c)=>a+dims(c).n,0),used=s.containers.reduce((a,c)=>a+(dims(c).n-emptySlots(c.id).length),0);
    const up=sibIdx(g,s,-1)<0,dn=sibIdx(g,s,1)<0;
    h+=`<div class="section" data-sec="${s.id}"><div class="sechead"><h3>${esc(s.name)}</h3><span class="sub">${used}/${tot}</span>${ui.reorder?`<span class="grow1"></span><button class="mv" data-act="moveSecD" data-s="${s.id}" data-d="-1" ${up?'disabled':''} aria-label="Move up">▲</button><button class="mv" data-act="moveSecD" data-s="${s.id}" data-d="1" ${dn?'disabled':''} aria-label="Move down">▼</button>`:`${(()=>{const w=waterInfo(s);return w?`<button class="chip water ${w.left<0?'late':w.left<=1?'soon':''}" data-act="waterSheet" data-s="${s.id}">💧 ${waterLbl(w.left)}</button>`:''})()}<button class="gear" data-act="editSection" data-s="${s.id}" aria-label="Edit">✏️</button>`}</div><div class="conts">`;
    s.containers.forEach((c,ci)=>{
      const D=dims(c);
      const head=ui.reorder?`<div class="cn row2"><button class="mv sm" data-act="moveContD" data-s="${s.id}" data-id="${c.id}" data-d="-1" ${ci===0?'disabled':''} aria-label="Move tray left">◀</button><span class="grow1" style="text-align:center">${esc(c.name||'Tray')}</span><button class="mv sm" data-act="moveContD" data-s="${s.id}" data-id="${c.id}" data-d="1" ${ci===s.containers.length-1?'disabled':''} aria-label="Move tray right">▶</button></div>`:(c.name?`<div class="cn">${esc(c.name)} · ${D.label}</div>`:'');
      h+=`<div class="cont">${head}<div class="grid ${slotSize(D.cols)<44?'xs':slotSize(D.cols)<56?'sm':''}" style="--cols:${D.cols};--sz:${slotSize(D.cols)}px">${Array.from({length:D.n},(_,i)=>slotHtml(c.id,i)).join('')}</div></div>`;
    });
    h+=`</div></div>`;
  }
  h+=`<button class="btn sec" data-act="newSection">＋ Add shelf / nursery</button>`;
  return h;
}

function dueRow(p,extra=''){

function dueView(){
  const D=dueItems(),WD=waterDue();
  const sec=(t,arr,fn)=>arr.length?`<h3 style="margin:14px 0 8px">${t} <span class="sub">(${arr.length})</span></h3>${arr.map(fn).join('')}`:'';
  let h='';
  h+=sec('💧 Water changes',WD,x=>`<button class="card row2" style="width:100%;text-align:left" data-act="waterSheet" data-s="${x.sec.id}"><span class="big">💧</span><span class="grow1"><b>${esc(x.sec.name)}</b>${db.gardens.length>1?`<br><span class="sub">${esc(x.g.name)}</span>`:''}</span><span style="text-align:right"><b>${waterLbl(x.w.left)}</b><br><span class="sub">${nice(x.w.due)}</span></span></button>`);
  h+=sec('🟠 Past harvest window',D.over,p=>dueRow(p,`${days(p.plantedAt)-crop(p.cropId).harvest}d over`));
  h+=sec('🟡 Ready to harvest',D.ready,p=>dueRow(p,'since '+nice(addDays(p.plantedAt,crop(p.cropId).harvest))));
  h+=sec('🔵 Check germination',D.germ,p=>dueRow(p,'due day '+crop(p.cropId).germ));
  h+=sec('🪴 Ready to transplant',D.xp,p=>dueRow(p,'target day '+xpDay(crop(p.cropId))));
  h+=sec('🟢 Ready within a week',D.soon,p=>dueRow(p,nice(addDays(p.plantedAt,crop(p.cropId).harvest))));
  return h||`<div class="empty-note">All caught up 🌿<br>Nothing needs attention right now.</div>`;
}

function logView(){
  const hs=[...db.harvests].sort((a,b)=>b.date.localeCompare(a.date));
  const totOz=hs.reduce((a,h)=>a+(h.oz||0),0);
  const ended=db.plantings.filter(p=>p.status!=='active');
  let h=`<div class="three"><div class="stat"><b>${activeP().length}</b><span>Growing now</span></div><div class="stat"><b>${hs.length}</b><span>Harvests</span></div><div class="stat"><b>${ozFmt(totOz)}</b><span>Total yield</span></div></div>`;
  const by={};for(const x of hs){const k=x.cropId;by[k]=(by[k]||0)+(x.oz||0)}
  const keys=Object.keys(by).sort((a,b)=>by[b]-by[a]);

function catOf(c){if(c.cat)return c.cat;const n=(c.name||'').toLowerCase();
 if(/microgreen/.test(n))return'Microgreen';
 if(/^(lettuce|endive)/.test(n))return'Lettuce';
 if(/basil|cilantro|coriander|parsley|dill|chive|spring onion|mint|catnip|thyme|oregano|rosemary|sage|tarragon|sorrel|borage|chamomile|lavender/.test(n))return(/borage|chamomile|lavender/.test(n)?'Herb':'Herb');
 if(/sunflower|marigold|baby.s breath|poppy|flower/.test(n))return'Flower';
 if(/tomato|pepper|eggplant|strawberry|cucumber|pumpkin|pea\b|bean/.test(n))return'Fruiting';
 if(/radish|beet|turnip|cauliflower|celery/.test(n))return'Root & other veg';
 return'Leafy green'}
function cropList(st){
 st=st||S;const q=(st.q||'').toLowerCase(),f=st.f||'recent',cat=st.cat||'';

    mutate(()=>{
      if(p){const old={...m.loc};const wm=inNursery(m),wp=inNursery(p);p.loc={c:old.c,i:old.i};m.loc={c:cid,i};if(wm&&!inNursery(m)){m.trayAt=today();if(!m.germinatedAt)m.germinatedAt=today()}if(wp&&!inNursery(p)){p.trayAt=today();if(!p.germinatedAt)p.germinatedAt=today()}logP(m,'swapped',`with ${crop(p.cropId).name}`);logP(p,'swapped',`with ${crop(m.cropId).name}`);toast('Swapped')}
      else{const was=inNursery(m);if(locOf(cid)&&locOf(m.loc.c)&&locOf(cid).s.id!==locOf(m.loc.c).s.id)noteFill(cid);m.loc={c:cid,i};if(was&&!inNursery(m)){m.trayAt=today();if(!m.germinatedAt)m.germinatedAt=today()}logP(m,'moved','to '+locLabel(m));toast('Moved')}
      ui.moving=null;
    });
    return;
  }
  if(p)return openSheet({type:'detail',pid:p.id});
  openSheet({type:'plant',cid,i,sel:null,q:'',f:db.plantings.length?'recent':'all',cat:'',date:today(),fill:false});
 },
 selCrop(el){S.sel=el.dataset.id;renderSheet()},
 doPlant(){
  if(!S.sel)return;
  const slots=S.fill?emptySlots(S.cid):[S.i];
  mutate(()=>{
    for(const i of slots){
      if(plantAt(S.cid,i))continue;
      noteFill(S.cid,S.date);
      const p={id:uid(),cropId:S.sel,loc:{c:S.cid,i},plantedAt:S.date,status:'active',note:'',log:[]};
      logP(p,'planted');db.plantings.push(p);
    }
    S=null;closeSheet();
  });
  toast(slots.length>1?`Planted ${slots.length}`:'Planted');
 },
 openPlant(el){openSheet({type:'detail',pid:el.dataset.p})},
 startMove(){ui.moving=S.pid;closeSheet();ui.tab='garden';render();toast('Pick a destination slot')},
 waterSheet(el){openSheet({type:'water',sid:el.dataset.s})},
 waterDone(el){let sec=null;for(const g of db.gardens){const x=g.sections.find(z=>z.id===S.sid);if(x)sec=x}if(!sec)return;mutate(()=>{sec.waterAt=addDays(today(),-(+el.dataset.o||0))});toast('Water change logged');closeSheet()},
 ungerminate(){const p=db.plantings.find(x=>x.id===S.pid);mutate(()=>{delete p.germinatedAt;const i=p.log.map(e=>e.t).lastIndexOf('germinated');if(i>=0)p.log.splice(i,1)})},
 germinated(){const p=db.plantings.find(x=>x.id===S.pid);mutate(()=>{p.germinatedAt=today();logP(p,'germinated')})},
 harvest(){const p=db.plantings.find(x=>x.id===S.pid);openSheet({type:'harvest',pid:S.pid,oz:'',date:today(),clear:!crop(p.cropId).cut})},
 doHarvest(){
  const p=db.plantings.find(x=>x.id===S.pid),oz=num(S.oz,0);
  mutate(()=>{
    db.harvests.push({id:uid(),plantingId:p.id,cropId:p.cropId,date:S.date,oz,cleared:!!S.clear});
    logP(p,'harvested',oz?ozFmt(oz):'');p.lastHarvest=S.date;
    if(S.clear){p.status='harvested';p.endedAt=S.date}
    S={type:'detail',pid:p.id};
  });
  toast('Harvest saved');
 },
 editAge(){const p=db.plantings.find(x=>x.id===S.pid);openSheet({type:'age',pid:S.pid,date:p.plantedAt})},
 doAge(){const p=db.plantings.find(x=>x.id===S.pid);if(!S.date)return;mutate(()=>{logP(p,'date changed',`${p.plantedAt} → ${S.date}`);p.plantedAt=S.date;S={type:'detail',pid:p.id}})},
 removeP(){openSheet({type:'remove',pid:S.pid,reason:''})},
 doRemove(){const p=db.plantings.find(x=>x.id===S.pid);mutate(()=>{p.status='removed';p.endedAt=today();logP(p,'removed',S.reason||'');closeSheet()})},
 /* crops */
 favCrop(el){const c=db.crops.find(x=>x.id===el.dataset.id);mutate(()=>{c.fav=!c.fav})},
 newCrop(){openSheet({type:'crop',id:null,from:S&&S.type==='plant'?S:null,draft:{name:'',variety:'',emoji:'🌱',germ:7,harvest:45,yield:3,cut:false,window:30,note:'',fav:false}})},
 editCrop(el){const c=db.crops.find(x=>x.id===el.dataset.id);openSheet({type:'crop',id:c.id,draft:{...c}})},
 pickEmoji(el){S.draft.emoji=el.dataset.e;renderSheet()},
 saveCrop(){
  const d=S.draft;if(!d.name.trim()){toast('Give it a name');return}
  d.name=d.name.trim();d.variety=(d.variety||'').trim();
  let back=S.from;
  mutate(()=>{
    if(S.id){Object.assign(db.crops.find(x=>x.id===S.id),d)}
    else{const c={...d,id:uid()};db.crops.push(c);if(back)back.sel=c.id}
    if(back){S=back}else closeSheet();
  });
 },
 delCrop(){
  if(db.plantings.some(p=>p.cropId===S.id)){toast('In use by plantings - can\'t delete');return}
  if(!confirm('Delete this crop?'))return;
  mutate(()=>{db.crops=db.crops.filter(c=>c.id!==S.id);closeSheet()});
 },
 /* crop import */
 importCrops(){openSheet({type:'import',text:'',update:false})},
 loadStarter(){S.text=STARTER_CSV;S.update=true;renderSheet()},
 impFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.tsv,.txt,.json,text/csv,text/plain,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(f)f.text().then(t=>{if(S&&S.type==='import'){S.text=t;renderSheet()}})};
  inp.click();
 },
 doImport(){
  const P=parseCrops(S.text);if(!P.rows.length){toast('Nothing to import');return}
  let added=0,upd=0;
  mutate(()=>{
    for(const r of P.rows){
      const {exists,...c}=r;
      if(exists){if(S.update){Object.assign(exists,c);upd++}}
      else{db.crops.push({...c,id:uid(),fav:false});added++}
    }
    closeSheet();
  });
  toast(`Imported ${added} new${upd?`, updated ${upd}`:''}`);
 },
 exportCrops(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['name','variety','germ_days','harvest_days','yield_oz','cut','window_days','emoji','note'],...db.crops.map(c=>[c.name,c.variety,c.germ,c.harvest,c.yield,c.cut?'yes':'no',c.window,c.emoji,c.note||''])];
  const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`growlog-crops-${today()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 },
 /* sections / containers */
 newSection(){openSheet({type:'newsection',name:'',kind:'tray',layout:'pods8'})},
 doNewSection(){
  if(!S.name.trim()){toast('Give it a name');return}
  const lay0=S.layout==='custom'?gridId(S.nr||6,S.nc||6):S.layout;
  mutate(()=>{curGarden().sections.push(mkSection(S.name.trim(),S.kind,S.kind==='nursery'&&lay0.startsWith('pods')?'nur4':lay0,S.kind==='nursery'?'':'Tray 1'));closeSheet()});
 },
 editSection(el){openSheet({type:'section',sid:el.dataset.s,newlay:'pods8'})},
 cropFilter(el){ui.cq.f=el.dataset.f;render()},
 pickFilter(el){S.f=el.dataset.f;renderSheet()},
 reorderToggle(){ui.reorder=!ui.reorder;if(ui.reorder)ui.moving=null;render()},
 moveSecD(el){
  const g=curGarden(),s=g.sections.find(x=>x.id===el.dataset.s),j=sibIdx(g,s,+el.dataset.d);if(j<0)return;
  mutate(()=>{const i=g.sections.indexOf(s);[g.sections[i],g.sections[j]]=[g.sections[j],g.sections[i]]});
  const node=document.querySelector(`[data-sec="${s.id}"]`);if(node)node.scrollIntoView({block:'center',behavior:'smooth'});
 },
 moveContD(el){
  const s=curGarden().sections.find(x=>x.id===el.dataset.s),i=s.containers.findIndex(c=>c.id===el.dataset.id),j=i+(+el.dataset.d);
  if(j<0||j>=s.containers.length)return;
  mutate(()=>{[s.containers[i],s.containers[j]]=[s.containers[j],s.containers[i]]});
 },
 moveGarden(el){
  const i=db.gardens.findIndex(g=>g.id===el.dataset.g),j=i+(+el.dataset.d);
  if(j<0||j>=db.gardens.length)return;
  mutate(()=>{[db.gardens[i],db.gardens[j]]=[db.gardens[j],db.gardens[i]]});
 },
 addContainer(){const s=curGarden().sections.find(x=>x.id===S.sid);const lay0=S.newlay==='custom'?gridId(S.nr||6,S.nc||6):(S.newlay||'pods8');mutate(()=>{s.containers.push(mkContainer('Tray '+(s.containers.length+1),lay0))})},
 delContainer(el){
  const id=el.dataset.id,n=activeP().filter(p=>p.loc.c===id).length;
  if(n&&!confirm(`${n} plant(s) in this tray will be removed from the garden. Continue?`))return;
  const s=curGarden().sections.find(x=>x.id===S.sid);
  mutate(()=>{activeP().filter(p=>p.loc.c===id).forEach(p=>{p.status='removed';p.endedAt=today();logP(p,'removed','tray deleted')});s.containers=s.containers.filter(c=>c.id!==id)});
 },
 delSection(){
  const s=curGarden().sections.find(x=>x.id===S.sid),ids=s.containers.map(c=>c.id);
  const n=activeP().filter(p=>ids.includes(p.loc.c)).length;
  if(!confirm(`Delete "${s.name}"${n?` and remove its ${n} plant(s)`:''}?`))return;
  mutate(()=>{activeP().filter(p=>ids.includes(p.loc.c)).forEach(p=>{p.status='removed';p.endedAt=today();logP(p,'removed','section deleted')});const g=curGarden();g.sections=g.sections.filter(x=>x.id!==s.id);closeSheet()});
 },
 /* gardens */
 newGarden(){openSheet({type:'garden',gid:null,name:'',tpl:'empty'})},
 doNewGarden(){if(!S.name.trim()){toast('Give it a name');return}mutate(()=>{const g=mkGarden(S.name.trim(),S.tpl);db.gardens.push(g);db.active=g.id;closeSheet()})},
 editGarden(el){openSheet({type:'garden',gid:el.dataset.g})},
 delGarden(){
  if(db.gardens.length<2){toast('Keep at least one garden');return}
  const g=db.gardens.find(x=>x.id===S.gid),ids=g.sections.flatMap(s=>s.containers.map(c=>c.id));
  const n=activeP().filter(p=>ids.includes(p.loc.c)).length;
  if(!confirm(`Delete "${g.name}"${n?` and remove its ${n} plant(s)`:''}?`))return;
  mutate(()=>{activeP().filter(p=>ids.includes(p.loc.c)).forEach(p=>{p.status='removed';p.endedAt=today();logP(p,'removed','garden deleted')});db.gardens=db.gardens.filter(x=>x.id!==g.id);if(db.active===g.id)db.active=db.gardens[0].id;closeSheet()});
 },
 /* backup */
 exportJSON(){
  const txt=JSON.stringify(db,null,1),name=`growlog-backup-${today()}.json`;
  const blob=new Blob([txt],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  const done=()=>{db.meta.lastBackup=today();save();render();toast('Backup saved')};
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(done).catch(()=>{})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);done()}
 },
 copyJSON(){navigator.clipboard.writeText(JSON.stringify(db)).then(()=>{db.meta.lastBackup=today();save();render();toast('Copied to clipboard')},()=>toast('Copy not allowed here'))},
 importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{
    try{const d=JSON.parse(t);if(!d.gardens||!d.crops||!d.plantings)throw 0;
      if(!confirm('Replace ALL current data with this backup?'))return;
      db=d;db.active=db.active||db.gardens[0].id;db.meta=db.meta||{};save();render();toast('Restored')}
    catch(e){toast('That file is not a GrowLog backup')}})};
  inp.click();
 },
 exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['crop','variety','garden','section','tray','slot','planted','germinated','status','ended','harvests','total_oz','notes']];
  for(const p of db.plantings){
    const c=crop(p.cropId),L=locOf(p.loc.c),hs=db.harvests.filter(h=>h.plantingId===p.id);
    rows.push([c.name,c.variety,L?.g.name,L?.s.name,L?.c.name,p.loc.i+1,p.plantedAt,p.germinatedAt||'',p.status,p.endedAt||'',hs.length,hs.reduce((a,h)=>a+(h.oz||0),0),p.note||'']);
  }
  const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`growlog-plantings-${today()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 },
 resetAll(){
  if(!confirm('Erase ALL gardens, plants and history from this device?'))return;
  if(!confirm('Really erase everything? This cannot be undone.'))return;
  db=seed();save();ui.tab='garden';render();toast('Reset');
 }
};

/* ============ input bindings ============ */
function setLayout(L,lay,keepFocus){
  const n=dims({layout:lay}).n;
  if(activeP().some(p=>p.loc.c===L.c.id&&p.loc.i>=n)){toast('Plants in the slots being removed - move them first');renderSheet();return}
  L.c.layout=lay;save();if(keepFocus)render();else refresh();
}
const binds={
 garden(el){db.active=el.value;save();render()},
 q(el){S.q=el.value;$('#pickList').innerHTML=pickList(cropList())},
 ckq(el){ui.cq.q=el.value;$('#cropRows').innerHTML=cropRows()},
 ccat(el){ui.cq.cat=el.value;render()},
 pcat(el){S.cat=el.value;renderSheet()},
 imptext(el){S.text=el.value;$('#impPreview').innerHTML=impPreview()},
 impupdate(el){S.update=el.checked;$('#impPreview').innerHTML=impPreview()},
 pdate(el){S.date=el.value||today()},
 fill(el){S.fill=el.checked;renderSheet()},
 hoz(el){S.oz=el.value},hdate(el){S.date=el.value||today()},hclear(el){S.clear=el.checked},
 adate(el){S.date=el.value},
 rreason(el){S.reason=el.value},
 pnote(el){const p=db.plantings.find(x=>x.id===S.pid);p.note=el.value;save()},
 cf(el){const d=S.draft,f=el.dataset.f;d[f]=el.dataset.n?num(el.value,0):el.value},
 cfcut(el){S.draft.cut=el.checked;if(el.checked&&S.draft.window<60)S.draft.window=90;renderSheet()},
 sname(el){const s=curGarden().sections.find(x=>x.id===S.sid);if(el.value.trim()){s.name=el.value;save();render()}},
 cname(el){const c=locOf(el.dataset.id).c;c.name=el.value;save();render()},
 clay(el){
  const L=locOf(el.dataset.id);let lay=el.value;if(lay==='custom'){const d=dims(L.c);lay=gridId(d.rows||Math.ceil(d.n/d.cols),d.cols)}
  setLayout(L,lay);
 },
 crows(el){const L=locOf(el.dataset.id),d=dims(L.c);setLayout(L,gridId(el.value,d.cols),true)},
 ccols(el){const L=locOf(el.dataset.id),d=dims(L.c);setLayout(L,gridId(d.rows,el.value),true)},
 wevery(el){let sec=null;for(const g of db.gardens){const x=g.sections.find(z=>z.id===S.sid);if(x)sec=x}if(sec&&+el.value>0){sec.waterEvery=Math.min(60,Math.round(+el.value));save();render()}},
 nr(el){S.nr=clampN(el.value)},nc(el){S.nc=clampN(el.value)},
 newlay(el){S.newlay=el.value;renderSheet()},
 nsname(el){S.name=el.value},nskind(el){S.kind=el.value;S.layout=el.value==='nursery'?'nur4':'pods8';renderSheet()},nslay(el){S.layout=el.value;renderSheet()},
 gname(el){const g=db.gardens.find(x=>x.id===S.gid);if(el.value.trim()){g.name=el.value;save();render()}},
 ngname(el){S.name=el.value},ngtpl(el){S.tpl=el.value}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=acts[el.dataset.act];if(f)f(el,e)});
const onIn=e=>{const el=e.target.closest('[data-bind]');if(el&&binds[el.dataset.bind])binds[el.dataset.bind](el)};
document.addEventListener('input',e=>{if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date')return;onIn(e)});
document.addEventListener('change',onIn);

/* ============ go ============ */
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
